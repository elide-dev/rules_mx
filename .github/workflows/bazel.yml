name: Bazel
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest-4-cores
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test pull request
        if: github.event_name == 'pull_request'
        run: |
          tools/check-graph
          tools/generate-graal --check
          bazelisk test --config=elide-processors //... @graal//sdk/... @graal//truffle/... @graal//compiler/...
          bazelisk test --config=elide-python //mx:export_test //mx:pack_jar_test //graal/nativebridge:launcher_test //graal:launcher_modules_test @graal//truffle:sl.test.Fibonacci @graal//compiler:GR36613Test
      - name: Test on BuildBuddy
        if: github.event_name != 'pull_request'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          tools/check-graph --config=buildbuddy-rbe
          tools/buildbuddy test --config=buildbuddy-rbe --config=elide-processors //... @graal//sdk/... @graal//truffle/... @graal//compiler/...
          tools/buildbuddy test --config=buildbuddy-rbe --config=labsjdk //mx:export_test //graal:launcher_modules_test //graal:truffle_polyglot_test //graal:truffle_runtime_modules_test @graal//truffle:sl.test.Fibonacci
          tools/buildbuddy test --config=buildbuddy-rbe --config=elide-python //mx:export_test //mx:pack_jar_test //graal/nativebridge:launcher_test //graal:launcher_modules_test @graal//truffle:sl.test.Fibonacci @graal//compiler:GR36613Test
          tools/buildbuddy test --config=buildbuddy-rbe --config=native-image-linux //tests/native_image:checkcopy_test //graal/nativebridge:native_isolate_test
