name: Bazel
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit supersedes earlier tests for the same PR. Each push to main has its own run.
concurrency:
  group: bazel-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Self-hosted pool: pushes, manual runs and same-repository PRs only. Pull requests from forks
    # never run on it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: linux-amd64-cipool
    steps:
      - name: Install Bazelisk
        env:
          BAZELISK_VERSION: v1.30.0
          BAZELISK_SHA256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/bin/bazelisk" \
            "https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  $RUNNER_TEMP/bin/bazelisk" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/bazelisk"
          ln -sf bazelisk "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test pull request
        if: github.event_name == 'pull_request'
        run: |
          tools/check-graph
          tools/generate-graal --check
          tools/graal-coverage --require-complete compiler espresso espresso-compiler-stub espresso-shared regex sdk substratevm tools truffle visualizer vm wasm web-image
          bazelisk build --config=elide-processors @graal//truffle:all_projects @graal//truffle:all_distributions @graal//compiler:all_projects @graal//compiler:all_distributions @graal//regex:all_projects @graal//regex:all_distributions @graal//tools:all_projects @graal//tools:all_distributions @graal//sdk:LLVM_TOOLCHAIN_FULL @graal//sdk:LLVM_TOOLCHAIN @graal//espresso-shared:ESPRESSO_SHARED @graal//espresso-shared:ESPRESSO_SVM
          bazelisk test --test_output=errors --config=source-native-image @graal//espresso:all_projects @graal//espresso:all_distributions //graal:espresso_native_standalone_test //graal:visualizer_install_test @graal//sulong:all_projects @graal//sulong:all_distributions @graal//sandbox-toolchains:all_projects @graal//sandbox-toolchains:all_distributions @graal//wasm:all_projects @graal//wasm:all_distributions //graal:sandbox_launcher_test //graal:sandbox_bash_launcher_test //graal:sulong_bootstrap_test //graal:sulong_external_fixture_test //graal:sulong_parser_fixture_test //graal:sulong_cmake_libraries_test //graal:sulong_cxx_runtime_test //graal:sulong_native_home_test //graal:sulong_test_native_archive_test //graal:sulong_runtime_test //graal:sulong_standalone_install_test //graal:wasm_native_launcher_test //graal:wasm_native_release_test //graal:wasm_jvm_release_test
          bazelisk test --test_output=errors //graal:sdk_toolchain_descriptors_test
          bazelisk test --test_output=errors --config=elide-processors //... @graal//sdk/... @graal//truffle/... @graal//compiler/... @graal//regex/... @graal//tools/... @graal//wasm:qualified_tests @graal//sulong:fixture_test
          bazelisk test --test_output=errors --config=elide-processors --config=labsjdk @graal//substratevm/... @graal//substratevm:support_distributions @graal//substratevm:test_distributions @graal//vm:VM_GRAALVM_SUPPORT //graal:source_native_image_test //graal:source_native_image_llvm_test @graal//espresso-compiler-stub:all_projects @graal//espresso-compiler-stub:all_distributions @graal//web-image:all_projects @graal//web-image:all_distributions @graal//web-image:unit_tests //graal:espresso_package_test //graal:espresso_guest_test //graal:espresso_standalone_test //graal:espresso_pom_classpath_test //graal:wasm_thin_launcher_test
          bazelisk test --test_output=errors --config=elide-python --config=elide-processors //mx:export_test //mx:pack_jar_test //graal:truffle_layout_test //graal/nativebridge:launcher_test //graal:launcher_modules_test @graal//truffle:sl.test.Fibonacci @graal//compiler:GR36613Test @graal//sulong:fixture_test @graal//wasm:org.graalvm.wasm.testcases.test.org.graalvm.wasm.testcases.test.CSuite
      - name: Test on BuildBuddy
        if: github.event_name != 'pull_request'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          tools/check-graph --config=buildbuddy-rbe
          tools/buildbuddy build --config=buildbuddy-rbe --config=elide-processors @graal//truffle:all_projects @graal//truffle:all_distributions @graal//compiler:all_projects @graal//compiler:all_distributions @graal//regex:all_projects @graal//regex:all_distributions @graal//tools:all_projects @graal//tools:all_distributions @graal//sdk:LLVM_TOOLCHAIN_FULL @graal//sdk:LLVM_TOOLCHAIN @graal//espresso-shared:ESPRESSO_SHARED @graal//espresso-shared:ESPRESSO_SVM
          tools/buildbuddy test --test_output=errors --config=buildbuddy-rbe --config=source-native-image @graal//espresso:all_projects @graal//espresso:all_distributions //graal:espresso_native_standalone_test //graal:visualizer_install_test @graal//sulong:all_projects @graal//sulong:all_distributions @graal//sandbox-toolchains:all_projects @graal//sandbox-toolchains:all_distributions @graal//wasm:all_projects @graal//wasm:all_distributions //graal:sandbox_launcher_test //graal:sandbox_bash_launcher_test //graal:sulong_bootstrap_test //graal:sulong_external_fixture_test //graal:sulong_parser_fixture_test //graal:sulong_cmake_libraries_test //graal:sulong_cxx_runtime_test //graal:sulong_native_home_test //graal:sulong_test_native_archive_test //graal:sulong_runtime_test //graal:sulong_standalone_install_test //graal:wasm_native_launcher_test //graal:wasm_native_release_test //graal:wasm_jvm_release_test
          tools/buildbuddy test --test_output=errors --config=buildbuddy-rbe //graal:sdk_toolchain_descriptors_test
          tools/buildbuddy test --test_output=errors --config=buildbuddy-rbe --config=elide-processors //... @graal//sdk/... @graal//truffle/... @graal//compiler/... @graal//regex/... @graal//tools/... @graal//wasm:qualified_tests @graal//sulong:fixture_test
          tools/buildbuddy test --test_output=errors --config=buildbuddy-rbe --config=elide-processors --config=labsjdk @graal//substratevm/... @graal//substratevm:support_distributions @graal//substratevm:test_distributions @graal//vm:VM_GRAALVM_SUPPORT //graal:source_native_image_test //graal:source_native_image_llvm_test @graal//espresso-compiler-stub:all_projects @graal//espresso-compiler-stub:all_distributions @graal//web-image:all_projects @graal//web-image:all_distributions @graal//web-image:unit_tests //graal:espresso_package_test //graal:espresso_guest_test //graal:espresso_standalone_test //graal:espresso_pom_classpath_test //graal:wasm_thin_launcher_test
          tools/buildbuddy test --test_output=errors --config=buildbuddy-rbe --config=labsjdk //graal:panama_module_test //mx:export_test //graal:launcher_modules_test //graal:truffle_polyglot_test //graal:truffle_runtime_modules_test @graal//truffle:sl.test.Fibonacci
          tools/buildbuddy test --test_output=errors --config=buildbuddy-rbe --config=elide-python --config=elide-processors //mx:export_test //mx:pack_jar_test //graal:truffle_layout_test //graal/nativebridge:launcher_test //graal:launcher_modules_test @graal//truffle:sl.test.Fibonacci @graal//compiler:GR36613Test @graal//sulong:fixture_test @graal//wasm:org.graalvm.wasm.testcases.test.org.graalvm.wasm.testcases.test.CSuite
          tools/buildbuddy test --test_output=errors --config=buildbuddy-rbe --config=source-native-image //graal:source_native_image_action_test @graal//substratevm:com.oracle.svm.with.space.test.com.oracle.svm.with.space.test.NativeImageResourceTest
          tools/buildbuddy test --test_output=errors --config=buildbuddy-rbe --config=native-image-linux //tests/native_image:checkcopy_test //graal/nativebridge:native_isolate_test
